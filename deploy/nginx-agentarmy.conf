# AgentArmy — Nginx: agentarmy.techmorainvest.com
# SSL: kurulumdan sonra `sudo certbot --nginx -d agentarmy.techmorainvest.com`
# certbot bu dosyaya 443 bloğunu + http→https yönlendirmesini kendisi ekler.
server {
    listen 80;
    server_name agentarmy.techmorainvest.com;

    root /opt/agentarmy/app/portal/dist;
    index index.html;

    # API → Express (systemd: agentarmy-api, port 3006)
    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 12m;   # /api/import 10mb limitiyle uyumlu
    }

    # D4b — A2A Agent Card (SPA index.html yutmasın)
    location /.well-known/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik asset cache
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
