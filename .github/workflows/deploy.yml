name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: dotnet test
        run: |
          dotnet build src/AgentArmy.Cli -c Release
          dotnet test tests/AgentArmy.Cli.Tests/AgentArmy.Cli.Tests.csproj -c Release

      - name: portal test + build check
        run: |
          npm ci --prefix portal
          npm run --prefix portal test
          npm run --prefix portal check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 20m
          script: sudo /opt/agentarmy/deploy.sh

      - name: Health check
        run: |
          sleep 5
          curl -fsS "https://agentarmy.techmorainvest.com/api/health"
