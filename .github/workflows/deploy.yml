name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: dotnet test
        run: |
          dotnet build src/AgentArmy.Cli -c Release
          dotnet test tests/AgentArmy.Cli.Tests/AgentArmy.Cli.Tests.csproj -c Release

      - name: portal test + build check
        run: |
          npm ci --prefix portal
          npm run --prefix portal test
          npm run --prefix portal check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 20m
          # Önce repo'daki deploy.sh'i yerleştir (eski kopya nginx sync'i kaçırmasın), sonra çalıştır
          script: |
            set -euo pipefail
            sudo -u agentarmy bash -c 'cd /opt/agentarmy/app && git fetch origin main && git reset --hard origin/main'
            sudo cp /opt/agentarmy/app/deploy/deploy.sh /opt/agentarmy/deploy.sh
            sudo chmod +x /opt/agentarmy/deploy.sh
            sudo /opt/agentarmy/deploy.sh

      - name: Health check
        run: |
          sleep 5
          curl -fsS "https://agentarmy.techmorainvest.com/api/health"

      - name: Agent Card smoke (D4b)
        run: |
          # SPA HTML değil JSON dönmeli (nginx /.well-known/ → API)
          code=$(curl -sS -o /tmp/agent-card.json -w "%{http_code}" \
            "https://agentarmy.techmorainvest.com/.well-known/agent-card.json")
          echo "HTTP $code"
          head -c 200 /tmp/agent-card.json; echo
          test "$code" = "200"
          grep -q '"skills"' /tmp/agent-card.json
          grep -q '"name"' /tmp/agent-card.json
          # SPA shell gelmesin
          if grep -qi '<html\|Agent Portal' /tmp/agent-card.json; then
            echo "FAIL: SPA HTML returned instead of Agent Card JSON"
            exit 1
          fi
