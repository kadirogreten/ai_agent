name: Agent Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # IP1.3: npm cache — portal/package-lock.json hash'ine göre
      - name: Cache npm deps
        uses: actions/cache@v4
        with:
          path: portal/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('portal/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # IP1.3: .NET NuGet cache
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # dotnet obj cache — project.assets.json burada; restore'u hızlandırır
      - name: Cache dotnet obj
        uses: actions/cache@v4
        with:
          path: src/AgentArmy.Cli/obj
          # Kaynak (.cs) değişince anahtar değişsin ki eski obj restore edilip derlemeyi gölgelemesin.
          key: dotnet-obj-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj') }}
          restore-keys: dotnet-obj-${{ runner.os }}-

      # dotnet build output cache
      - name: Cache dotnet build output
        uses: actions/cache@v4
        with:
          path: src/AgentArmy.Cli/bin
          key: dotnet-bin-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj') }}
          restore-keys: dotnet-bin-${{ runner.os }}-

      - name: Install portal deps
        run: npm ci --prefix portal

      # Restore her zaman çalışır; NuGet cache varsa çok hızlı (~2s)
      - name: Restore .NET dependencies
        run: dotnet restore src/AgentArmy.Cli
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

      - name: Build .NET CLI
        # --no-incremental: cache'ten gelen eski obj/bin'in derlemeyi gölgelemesini engeller,
        # her zaman güncel kaynaktan derler (kod değişiklikleri kesinlikle binary'ye yansır).
        run: dotnet build src/AgentArmy.Cli --configuration Release --no-restore --no-incremental
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

      # IP1.3: Worker --no-build flag ile çalışır; SLA & timeout env değişkenleri
      - name: Run worker (claim jobs)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
          MAX_JOBS: "3"
          # dotnet run --no-build → build adımı zaten yapıldı; çalıştırma süresi ~2s kısalır
          DOTNET_NO_BUILD: "true"
          # dotnet process başına max süre (ms) — LLM çağrısı + retry + multi-step.
          # 90s yetmiyor: gerçek bir run (web_search + verifier + editor) 3-8 dakika.
          # GHA job timeout 30dk, içine sığacak şekilde 12dk veriyoruz.
          WORKER_CMD_TIMEOUT_MS: "920000"
          # SLA hedef (ms) — oluşturma → tamamlama
          WORKER_SLA_THRESHOLD_MS: "240000"
          # Stale job eşiği (dakika) — GHA timeout_minutes 30 ile uyumlu
          WORKER_STALE_MINUTES: "35"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: npx --yes --prefix portal tsx portal/api/lib/runRequestWorker.ts
